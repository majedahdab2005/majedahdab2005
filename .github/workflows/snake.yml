name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: majedahdab2005
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%231BE45C&color_dots=%2305080A,%230E8F3C,%2317B44A,%231BE45C,%234DFF8A

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
