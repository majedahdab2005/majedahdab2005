<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 176" width="486" height="176" role="img" aria-label="KAGU OS">
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#12291C" stroke-width="1" opacity="0.85"/></pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1BE45C" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1BE45C" stop-opacity="0.16"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0E8F3C" stop-opacity="0"/>
    <stop offset="45%" stop-color="#1BE45C"/>
    <stop offset="100%" stop-color="#0E8F3C" stop-opacity="0"/>
  </linearGradient>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
<rect width="486" height="176" rx="12" fill="#05080A"/>
<rect width="486" height="176" rx="12" fill="url(#grid)" opacity="0.35"/>
<rect x="0.75" y="0.75" width="484.5" height="174.5" rx="12" fill="none" stroke="#1C4A2E" stroke-width="1.5"/>
<path d="M 12 0 L 5 0 A 5 5 0 0 0 0 5 L 0 171 A 5 5 0 0 0 5 176 L 12 176 Z" fill="#1BE45C"/>
<rect x="0" y="0" width="5" height="176" fill="#4DFF8A" opacity="0.6">
  <animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" repeatCount="indefinite"/>
</rect>
