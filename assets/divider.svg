<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="img" aria-label="divider">
<defs><linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#0E8F3C" stop-opacity="0"/>
  <stop offset="50%" stop-color="#0E8F3C" stop-opacity="0.75"/>
  <stop offset="100%" stop-color="#0E8F3C" stop-opacity="0"/>
</linearGradient>
<linearGradient id="p" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#4DFF8A" stop-opacity="0"/>
  <stop offset="50%" stop-color="#4DFF8A"/>
  <stop offset="100%" stop-color="#4DFF8A" stop-opacity="0"/>
</linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="2"/></filter></defs>
<rect x="0" y="13" width="1000" height="1.5" fill="url(#d)"/>
<rect x="-220" y="12" width="220" height="3" fill="url(#p)" filter="url(#g)">
  <animate attributeName="x" values="-220;1000" dur="4.5s" repeatCount="indefinite"/>
</rect>
<g transform="translate(500.0,14)">
  <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#05080A" stroke="#1BE45C" stroke-width="1.5"/>
  <rect x="-2" y="-2" width="4" height="4" transform="rotate(45)" fill="#4DFF8A">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>