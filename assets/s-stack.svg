<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 76" width="1000" height="76" role="img" aria-label="STACK">
<defs>
  <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1BE45C" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#0E8F3C" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#4DFF8A" stop-opacity="0"/>
    <stop offset="50%" stop-color="#4DFF8A"/>
    <stop offset="100%" stop-color="#4DFF8A" stop-opacity="0"/>
  </linearGradient>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1000" height="76" fill="#05080A"/>
<rect x="0" y="16" width="4" height="40" fill="#1BE45C">
  <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
</rect>
<text x="22" y="34" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#0E8F3C" letter-spacing="2.6">// 02</text>
<text x="22" y="60" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#DCEFE2" letter-spacing="2.5" filter="url(#softGlow)">STACK</text>
<text x="133" y="60" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#48604F" letter-spacing="1">what I build it with</text>
<rect x="0" y="68" width="1000" height="1.5" fill="url(#ln)"/>
<rect x="-180" y="67.25" width="180" height="3" fill="url(#pulse)" opacity="0.8">
  <animate attributeName="x" values="-180;1000" dur="5s" repeatCount="indefinite"/>
</rect>
</svg>