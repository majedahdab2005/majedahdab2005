<defs>
  <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M 25 0 L 0 0 0 25" fill="none" stroke="#12291C" stroke-width="1" opacity="0.85"/></pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1BE45C" stop-opacity="0"/>
    <stop offset="85%" stop-color="#1BE45C" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#4DFF8A" stop-opacity="0.30"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1BE45C" stop-opacity="0.34"/>
    <stop offset="60%" stop-color="#0E8F3C" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0E8F3C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#4DFF8A"/>
    <stop offset="55%" stop-color="#1BE45C"/>
    <stop offset="100%" stop-color="#0E8F3C" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0E8F3C" stop-opacity="0"/>
    <stop offset="35%" stop-color="#1BE45C"/>
    <stop offset="60%" stop-color="#4DFF8A"/>
    <stop offset="100%" stop-color="#0E8F3C" stop-opacity="0"/>
  </linearGradient>
  <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

